plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}
// In your module-level build.gradle (app) file

apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.example.flashcard'
    // Compile SDK target is 36, which is modern and good practice
    compileSdk 36

    defaultConfig {
        applicationId "com.example.flashcard"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {

    // --- Core Android & Kotlin Dependencies ---
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    // --- Compose Setup (Relies on BOM for versions) ---
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3

    // --- **CRITICAL FIX FOR KEYBOARDOPTIONS** ---
    // Explicitly adding the UI text module with a standard version to force resolution
    implementation 'androidx.compose.ui:ui-text:1.6.0'

    // --- External Feature Dependencies ---
    implementation 'androidx.navigation:navigation-compose:2.7.5'
    implementation("androidx.compose.material:material-icons-extended:1.5.4")

    // --- Firebase Authentication Setup (Using BOM) ---
    implementation platform('com.google.firebase:firebase-bom:32.4.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation libs.androidx.runtime

    // --- Testing Dependencies ---
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
